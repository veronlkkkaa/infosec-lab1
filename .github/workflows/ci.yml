name: Kotlin API security CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-tests:
    name: Build and API tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Build and integration tests
        run: ./gradlew --no-daemon --console=plain build
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: api-tests
          path: |
            build/reports/tests/test/
            build/test-results/test/
          if-no-files-found: error
          retention-days: 30

  sast:
    name: SAST - CodeQL
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-extended
      - name: Compile application for CodeQL
        run: >-
          ./gradlew --no-daemon --console=plain --no-build-cache
          -Pkotlin.compiler.execution.strategy=in-process clean classes
      - name: Analyze Kotlin
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          output: build/reports/codeql
          category: java-kotlin
      - name: Check CodeQL findings
        run: python3 scripts/check-codeql.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: codeql-sast
          path: build/reports/codeql/
          if-no-files-found: error
          retention-days: 30

  sca:
    name: SCA - OWASP Dependency-Check
    runs-on: ubuntu-24.04
    concurrency:
      group: sca-nvd-${{ github.repository }}
      cancel-in-progress: false
    # The initial NVD import can exceed one hour; later runs reuse the completed database.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Restore NVD database
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .cache/dependency-check
          key: nvd-${{ runner.os }}-dc12.2.2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            nvd-${{ runner.os }}-dc12.2.2-
      - name: Update vulnerability database
        timeout-minutes: 150
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./gradlew --no-daemon --console=plain --info dependencyCheckUpdate
      # Save only a successfully updated database, before the vulnerability gate.
      - name: Save updated NVD database
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        continue-on-error: true
        with:
          path: .cache/dependency-check
          key: nvd-${{ runner.os }}-dc12.2.2-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Analyze direct and transitive runtime dependencies
        id: sca_analysis
        timeout-minutes: 20
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./gradlew --no-daemon --console=plain --info dependencyCheckAnalyze
      - name: Upload SCA reports
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        # A vulnerability gate can fail after producing reports. A skipped analysis cannot.
        if: ${{ !cancelled() && (steps.sca_analysis.outcome == 'success' || steps.sca_analysis.outcome == 'failure') }}
        with:
          name: dependency-check-sca
          path: |
            build/reports/dependency-check/dependency-check-report.html
            build/reports/dependency-check/dependency-check-report.json
          if-no-files-found: error
          retention-days: 30
